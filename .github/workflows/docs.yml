name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # The page runs the library, so the library is compiled to JavaScript for
      # it. The artefact is built here and never committed.
      - name: build the engine the page runs
        run: |
          moon update
          moon build --target js --release src/examples/browser
          mkdir -p docs/engine
          cp _build/js/release/build/examples/browser/browser.js docs/engine/moonxml.js

      - name: regenerate the API page from the packages
        run: |
          moon info --target all
          python3 scripts/gen_api.py .

      - name: the published site must match its source
        run: git diff --exit-code -- docs/

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
