name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Version
        run: moon version
      - name: Check
        run: moon check
      - name: Test
        run: moon test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Fetch the corpus and verify the vendored copy is identical
        run: |
          python -m pip download html5lib==1.1 --no-deps --no-binary=:all: -d "$RUNNER_TEMP/h5"
          tar xzf "$RUNNER_TEMP/h5/html5lib-1.1.tar.gz" -C "$RUNNER_TEMP/h5"
          diff -r "$RUNNER_TEMP/h5/html5lib-1.1/html5lib/tests/testdata/tree-construction" \
                  vendor/html5lib-tests/tree-construction
      - name: Fetch the tokenizer corpus and verify the vendored copy
        run: |
          git clone --depth 1 https://github.com/html5lib/html5lib-tests "$RUNNER_TEMP/h5tests"
          diff -r "$RUNNER_TEMP/h5tests/tokenizer" vendor/html5lib-tests/tokenizer
      - name: Verify generated fixtures are current
        run: |
          python scripts/gen_html5lib.py
          python scripts/gen_tokenizer_tests.py
          git diff --exit-code tests/html5lib_cases.mbt tests/tokenizer_cases.mbt
      - name: Verify the entity table is current
        run: |
          python scripts/gen_entities.py
          git diff --exit-code html/entities.mbt
      - name: Conformance rate
        run: moon test
